<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>淘宝闪购 - 闪电降价·手慢无</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #F50057 0%, #C51162 100%);">
    <div class="banner_badge">⚡ 闪电直降 · 1小时售罄即止</div>
    <div class="banner_title">淘宝闪购 · 超值特惠</div>
    <div class="banner_subtitle">每小时更新一波好物，超低惊喜折扣</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="product_card">
        <div class="product_cover" style="height: 140px;">
          <img src="https://images.unsplash.com/photo-1585336261026-61e86095594b?w=500" alt="折叠椅">
          <div class="product_tag">闪降 50%</div>
        </div>
        <div class="product_info">
          <div class="product_name">便携式超轻户外露营折叠靠背椅 附收纳袋</div>
          <div class="product_price_row">
            <div>
              <span class="price_now"><small>￥</small>39.90</span>
              <span class="price_old">￥79.00</span>
            </div>
            <button class="btn btn_primary" style="padding: 4px 12px; font-size: 12px;" onclick="showToast('⚡ 闪购下单成功！')">立即秒</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
