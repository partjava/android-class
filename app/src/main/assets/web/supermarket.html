<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天猫超市 - 送货上门·次日必达</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #00A65A 0%, #008744 100%);">
    <div class="banner_badge">🚚 满88包邮 · 承诺次日达 · 送货上门</div>
    <div class="banner_title">天猫超市 · 社区生鲜与日用</div>
    <div class="banner_subtitle">品质生鲜、粮油米面、休闲零食一站式购齐</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>🛒 爆款日用直降</span>
      </div>

      <div class="product_grid">
        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500" alt="牛奶">
            <div class="product_tag" style="background: #2E7D32;">猫超自营</div>
          </div>
          <div class="product_info">
            <div class="product_name">高钙纯牛奶 250ml*24盒 整箱装</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>49.90</span>
              <button class="btn btn_green" style="padding: 2px 8px; font-size: 11px;" onclick="showToast('已加入天猫超市购物车！')">加车</button>
            </div>
          </div>
        </div>

        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1621996346565-e3d5d6281699?w=500" alt="坚果">
            <div class="product_tag" style="background: #2E7D32;">猫超自营</div>
          </div>
          <div class="product_info">
            <div class="product_name">每日坚果干果混合礼盒装 750g</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>69.90</span>
              <button class="btn btn_green" style="padding: 2px 8px; font-size: 11px;" onclick="showToast('已加入天猫超市购物车！')">加车</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
