<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>新人特惠 - 新人专享1元购</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #FF3D00 0%, #DD2C00 100%);">
    <div class="banner_badge">🎉 新人首单 · 1元包邮 · 0元尝鲜</div>
    <div class="banner_title">新人特惠专场</div>
    <div class="banner_subtitle">注册即送 188 元大礼包，任选一件 1 元包邮到家！</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>🔥 新人 1 元包邮专区</span>
      </div>
      <div class="product_card">
        <div class="product_cover" style="height: 140px;">
          <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500" alt="太阳镜">
          <div class="product_tag">新人 ￥1.00</div>
        </div>
        <div class="product_info">
          <div class="product_name">经典防紫外线黑超太阳镜 墨镜男女同款</div>
          <div class="product_price_row">
            <div>
              <span class="price_now"><small>￥</small>1.00</span>
              <span class="price_old">￥49.00</span>
            </div>
            <button class="btn btn_primary" style="padding: 4px 12px; font-size: 12px;" onclick="showToast('🎉 新人资格已确认，立即 1 元下单！')">1元抢购</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
