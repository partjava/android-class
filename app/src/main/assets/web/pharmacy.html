<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>阿里健康大药房 - 正品好药·急送上门</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #00BFA5 0%, #00897B 100%);">
    <div class="banner_badge">💊 执业药师在线审方 · 正品溯源 · 隐私发货</div>
    <div class="banner_title">阿里药房 · 家庭常备医药箱</div>
    <div class="banner_subtitle">24小时在线问诊，极速派送常用急用药</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>🩺 家庭常备药品</span>
      </div>
      <div class="product_grid">
        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1584017911766-d451b3d0e843?w=500" alt="眼药水">
            <div class="product_tag" style="background: #00897B;">OTC药品</div>
          </div>
          <div class="product_info">
            <div class="product_name">人工泪液眼药水 缓解眼疲劳干涩 15ml</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>22.50</span>
              <button class="btn btn_green" style="padding: 2px 8px; font-size: 11px;" onclick="showToast('已加入药房购物清单')">立即买</button>
            </div>
          </div>
        </div>

        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1577401239170-897942555fb3?w=500" alt="感冒冲剂">
            <div class="product_tag" style="background: #00897B;">OTC药品</div>
          </div>
          <div class="product_info">
            <div class="product_name">感冒清热颗粒 疏风散寒 止咳退烧冲剂 10袋装</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>18.80</span>
              <button class="btn btn_green" style="padding: 2px 8px; font-size: 11px;" onclick="showToast('已加入药房购物清单')">立即买</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
