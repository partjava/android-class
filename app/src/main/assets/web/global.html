<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天猫国际 - 原装进口·官方保税直发</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #512DA8 0%, #311B92 100%);">
    <div class="banner_badge">✈️ 100% 海外正品 · 正品溯源 · 保税仓直发</div>
    <div class="banner_title">天猫国际 · 全球甄选</div>
    <div class="banner_subtitle">足不出户买遍全球大牌，包税包邮极速通关</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>🌏 全球爆款美妆保健</span>
      </div>

      <div class="product_grid">
        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1571781926291-c477ebfd024b?w=500" alt="护肤面霜">
            <div class="product_tag" style="background: #673AB7;">法国原产</div>
          </div>
          <div class="product_info">
            <div class="product_name">法国进口 玻尿酸补水修护高保湿面霜 50ml</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>188.00</span>
              <button class="btn btn_primary" style="padding: 2px 8px; font-size: 11px; background: #673AB7;" onclick="showToast('已加入跨境直邮购物车！')">抢购</button>
            </div>
          </div>
        </div>

        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500" alt="维生素胶囊">
            <div class="product_tag" style="background: #673AB7;">澳洲原装</div>
          </div>
          <div class="product_info">
            <div class="product_name">澳洲进口 复合维生素片 呵护全家健康 120粒</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>129.00</span>
              <button class="btn btn_primary" style="padding: 2px 8px; font-size: 11px; background: #673AB7;" onclick="showToast('已加入跨境直邮购物车！')">抢购</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
