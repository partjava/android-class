<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>闲鱼 - 二手闲置交易平台</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #FFD600 0%, #FFAB00 100%); color: #212121;">
    <div class="banner_badge" style="background: rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.2); color: #212121;">🐟 官方担保 · 同城面交 · 闲置换钱</div>
    <div class="banner_title">闲鱼 · 校园与周边二手</div>
    <div class="banner_subtitle">让你的闲置游起来！发布闲置只需 10 秒</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>📍 晴川学院附近在售闲置</span>
        <button class="btn btn_primary" style="padding: 4px 12px; font-size: 11px;" onclick="showToast('正在打开快速发布闲置面板...')">+ 卖闲置</button>
      </div>

      <div class="product_card" style="margin-bottom: 10px;">
        <div class="product_cover" style="height: 130px;">
          <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=500" alt="笔记本电脑">
          <div class="product_tag" style="background: #FF6F00;">99新自用</div>
        </div>
        <div class="product_info">
          <div class="product_name">MacBook Air M2 16G+512G 深空灰 无磕碰 箱说全</div>
          <div class="product_price_row">
            <div>
              <span class="price_now"><small>￥</small>5200.00</span>
              <span style="font-size: 10px; color: #78909C; margin-left: 6px;">校内自提</span>
            </div>
            <button class="btn btn_outline" style="padding: 2px 10px; font-size: 11px;" onclick="showToast('正在联系卖家【学长小李】...')">私聊聊价</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
