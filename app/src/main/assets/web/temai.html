<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天天特卖 - 9.9包邮·工厂直供</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #FF6F00 0%, #FF8F00 100%);">
    <div class="banner_badge">📦 极致性价比 · 工厂直采 · 9.9包邮</div>
    <div class="banner_title">今日特卖 · 厂货直通车</div>
    <div class="banner_subtitle">省去中间商差价，一件也是批发底价！</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>🔥 9.9 元特惠爆款包邮</span>
      </div>

      <div class="product_grid">
        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500" alt="耳机线">
            <div class="product_tag">9.9包邮</div>
          </div>
          <div class="product_info">
            <div class="product_name">高韧度编织快充数据线 适用Type-C/苹果 1.5米</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>9.90</span>
              <button class="btn btn_primary" style="padding: 2px 8px; font-size: 11px;" onclick="showToast('已下单 9.9 包邮专享商品！')">抢购</button>
            </div>
          </div>
        </div>

        <div class="product_card">
          <div class="product_cover" style="height: 120px;">
            <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?w=500" alt="保温杯">
            <div class="product_tag">19.9包邮</div>
          </div>
          <div class="product_info">
            <div class="product_name">不锈钢真空随手保温杯 简约便携车载茶水杯</div>
            <div class="product_price_row">
              <span class="price_now"><small>￥</small>19.90</span>
              <button class="btn btn_primary" style="padding: 2px 8px; font-size: 11px;" onclick="showToast('已下单特卖专享商品！')">抢购</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
