<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>淘宝礼物 - 挑礼物·送心意·定制贺卡</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #EC407A 0%, #D81B60 100%);">
    <div class="banner_badge">🎁 专属礼盒包装 · 手写心意卡 · 节日惊喜</div>
    <div class="banner_title">淘宝礼物 · 送TA心动</div>
    <div class="banner_subtitle">生日、纪念日、谢师恩，精选暖心礼物指南</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card_title">
        <span>💝 热门礼物推荐</span>
      </div>
      <div class="product_card">
        <div class="product_cover" style="height: 150px;">
          <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=500" alt="香薰礼盒">
          <div class="product_tag" style="background: #E91E63;">高档定制礼盒</div>
        </div>
        <div class="product_info">
          <div class="product_name">天然植物无烟香薰蜡烛礼盒 附赠旋转风车与手写卡</div>
          <div class="product_price_row">
            <span class="price_now"><small>￥</small>128.00</span>
            <button class="btn btn_primary" style="padding: 4px 12px; font-size: 12px; background: #E91E63;" onclick="showToast('已进入专属定制礼盒定制页面！')">选礼盒送TA</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
