<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>天猫新品 - 官方首发·大牌黑科技</title>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <div class="page_header_banner" style="background: linear-gradient(135deg, #1A237E 0%, #283593 100%);">
    <div class="banner_badge">✨ 官方独家首发 · 限量尝鲜 · 免息分期</div>
    <div class="banner_title">天猫小黑盒 · 重磅新品</div>
    <div class="banner_subtitle">全球顶尖科技数码、潮流尖货第一手开箱</div>
  </div>

  <div class="container">
    <div class="card">
      <div class="product_card">
        <div class="product_cover" style="height: 160px;">
          <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=500" alt="超极本">
          <div class="product_tag" style="background: #3F51B5;">新品首发</div>
        </div>
        <div class="product_info">
          <div class="product_name">年度旗舰 AI 超极本 4K OLED触控屏 搭载最新酷睿Ultra处理器</div>
          <div class="product_price_row">
            <div>
              <span class="price_now"><small>￥</small>7999.00</span>
              <span style="font-size: 11px; color: #3F51B5; margin-left: 6px;">享24期免息</span>
            </div>
            <button class="btn btn_primary" style="padding: 4px 12px; font-size: 12px; background: #3F51B5;" onclick="showToast('已成功预约首发新品！开售将为您短信提醒')">立即预约</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/shop.js"></script>
</body>
</html>
